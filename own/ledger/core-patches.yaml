  why: "Incident 2026-10-11 (session ses_edaa83c77ffe): a siwc Responses stream for gpt-6-astra opened a `patch` tool call at 11:14:43Z and then sent only keepalives and `response.in_progress` for 60 minutes. The 5-minute HTTP chunk timeout (ai route/transport/http.ts, DEFAULT_HTTP_TIMEOUT_MS) measures raw bytes before SSE parsing, so every keepalive reset it; parsed-away events produce nothing (route/framing.ts, open-responses.ts) and tool-argument deltas are not published (core publish-llm-event.ts), so no durable event arrived. LocationActivity (core location-activity.ts) counts durable events only and after 60 minutes called execution.interrupt(id, {reason: inactivity}), which settles and releases the claim exactly like a user stop: the turn ended silently with a half-written call. Codex watches each parsed event (stream_idle_timeout_ms 300 s, stream_max_retries 5), Claude Code has event and byte watchdogs, deepseek-harness arms an idle watchdog around next() and retries TIMEOUT; the ChatGPT backend cuts streams at about 900 s with request_timeout."
