  why: "Codex compacts locally by sending the history with its own summarization prompt (codex-rs compact.rs SUMMARIZATION_PROMPT) and rebuilding history as the retained user messages plus SUMMARY_PREFIX + summary. Core appends its own summary prompt after the request hooks and checks its template, so a harness cannot ask Codex's question or keep what it needs to rebuild Codex's history. Since 2026-10-13 the own harness asks every model with own's checkpoint prompt through the same seam and needs the reply checked and repaired once (own/docs/11-compaction-prompt.md). A failed automatic compaction fails the step, and every later message retries the same compaction, so a model that refuses or a provider that is down leaves the session stuck; the fallbacks keep it going (own/docs/11 §3)."
  change: "SessionCompaction (plugin hook event) gets optional `prompt` and `metadata`. When a compaction hook sets `prompt`, summary compaction appends that prompt instead of core's, takes the whole non-empty reply as the summary (no template check or nudge), and stores `metadata` on the checkpoint. Since v2.2.6 (US6-5) to-llm-message no longer copies it onto the checkpoint message: own-harness reads a checkpoint's metadata from `ctx.session.context`. Optional `accept(reply)` turns the reply into the stored summary or rejects it (undefined); a rejected reply gets one follow-up with `repair` and a second rejection fails the compaction. When the compaction fails (an error, a refusal, or a reply rejected twice), optional `fallbackModels` are asked in turn: each is resolved like the compaction agent's model, the hooks run again for it, its provider state is dropped, and it continues the open compaction message without fallbacks of its own. Then optional `fallback(error)` supplies a summary made without a model through the hook-result path. Either records `fallback: { failed, reason, model? }` in the checkpoint's metadata. Without the fields nothing changes. Since the v2.0.32 merge the hook's prompt request and its repair follow-up go through upstream's fitOutput (ae8d59f8b5) like core's prompt and nudge: an output limit is lowered to the room the request actually sent leaves in the window (never added or raised), so the fix also reaches own-harness compactions, which always set `prompt`. A test in session-compaction.test.ts sends a request whose hook prompt, and then whose repair, leaves less than the 20k limit in the window and checks that each is lowered."
