  merge_note: "v2.2.5 sync (2026-11-02, decisions US5): upstream's scanner (dc0bfc5ea4 on 8609cc55d0, v2.2.2) replaced tree-sitter with one hand-written scanner (`ShellParse.scan(command, shell, cwd)`, no `portable` option) that asks redirections (`> x`, `'hi' > x`), PowerShell method calls (`[IO.File]::WriteAllText(...)`, `$x.Delete()`), nested substitutions in assignments, and splits PowerShell at a lone CR; a bash command with a lone CR fails the scan (refused, not run). ShellParse.approval kept only the whole-ask of a statement with no command in it (`$x = 'hi'`, `X=1`, `export X=1`); the lone-CR rewrite and the whole-and-by-line asks are gone. The anchor moved to `unwrapDirectoryCommand` (the old `parts` is gone). Earlier: partly upstreamed in the v2.0.32 merge: upstream 6a7cedcbf1 added PermissionDomain.assert(AssertInput) under the same name as own's two-argument assert. The merge auto-merged core plugin/host.ts with both `assert` keys in one object literal (the later, upstream one would have won at runtime and dropped sessionID and agent from every own-harness ask); own's key, its PermissionAssertInput type and test stubs were removed and the harness callers moved to upstream's input."
