  change: "pool.ts: a cap (own's setting, default 8) on live claude processes of the service (the registry is process-wide). A new process takes a free slot; at the cap the least recently used idle process is closed (spares first; its record and transcript stay, so the conversation resumes later); a process mid-turn, waiting for tool results, or with a request in flight is never closed; a start waits in order when every process is protected (children their parked parent waits for first), and is reported (observer `pool`, with the session waiting); when every live process has been stuck for 3 s (parked on a subagent, task or question tool, known by name at the tool call, CAG-43; ordinary tool parks do not count) and the waiting start is a subagent (it has a parent, CAG-35: the parent may be on another provider, so the pool cannot see who waits for it), it goes over the cap (`over`, counted from the live set each time) since nothing else could ever free a slot; over-cap starts stop at twice the cap, beyond which only a start that unblocks its waiting parent (no live subagent of that parent) goes. Freed slots go in order of arrival, a start unblocking its parent passing each earlier start once (CAG-45). Side calls (also the login check and an idle account's usage read, CAG-38) have a bound of their own (the cap), never take a conversation's slot, never make the pool stuck and are never closed (CAG-46). New settings apply at once (CAG-36): `configure` and own-accounts run every pool's re-check (registered on the channel), a higher cap grants waiting starts, a lower one closes the idle processes beyond it and a busy one once it is idle; `busy(configDir, close)` on the channel names a folder's busy conversations and, with `close`, closes its idle processes and spares before the folder moves to the other route (CAG-37). sessions.ts acquires a slot before starting claude (a cancelled wait leaves the queue; a failed start gives the slot back), releases it when the process stops, re-evaluates the queue when a turn parks or ends, arms a two-minute idle exit once half the cap is used (shortening timers already running), lets the pool close a process whose tool results will not come (OpenCode stopped the session), and keeps spares (SDK prewarm, alpha; `spares` per account folder, off by default) with the latest new conversation's host options, claimed by the next new conversation (a refused claim falls back to a normal start). session.ts claims a spare instead of starting a query; io.ts exposes prewarm; observer.ts carries the pool status and settings; request-kind.ts, claude-agent-language-model.ts and session.ts hand the subagent's parent id to the pool."
  alternatives_rejected:
