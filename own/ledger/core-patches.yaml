# own-open-code core patch ledger (own/FORK.md §6). The P-0xx ids here are canonical; 01/02/03 cite them.
#
# status: planned (not applied yet) | active (applied, diff must exist) | candidate | upstreamed | dropped | rejected
# files[].path       repo-relative upstream file
# files[].anchor     stable code fragment near the patch site (not a line number). check-ledger warns when a
#                    planned/candidate anchor disappears from the file.
# files[].marker     "OWN-PATCH(P-xxx)"; active patches need `// OWN-PATCH(P-xxx) begin` ... `end` in the file
# files[].churn_30d  upstream-v2 commits touching the file in the 30 days before `added` (rule: <= 5)
# files[].max_lines  optional cap for lines between begin/end markers (default 30, own/FORK.md §6.1)
#
# node own/scripts/check-ledger.mjs verifies: upstream-v2...HEAD diff (minus own/**, packages/own-*/**, bun.lock and
# unabsorbed cherry-picks) == files of `active` patches, markers present, marker spans within max_lines.
# Budget: 2 planned patches for MVP, at most 6 active at a time.

