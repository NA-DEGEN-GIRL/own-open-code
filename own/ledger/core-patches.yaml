  why: "`/reset-context` (03 §18.13, §18.18, 11 §7): start over in the same conversation (same session ID, metadata, harness, team area, account binding and prompt-cache key) without the earlier messages, and undo it while it is the newest boundary. Every history read the model sees bounds at SessionHistory.latestCompaction, so a marker there is the one place that also cuts what a plugin cannot reach: summary compaction's verbatim `recent` part (splitConversation over core's own history), native trigger compaction's retained users (SessionHistory.load 'local'), the auto-compaction anchor and output limit (due(), estimatePrompt, P-017), the instruction epoch, `session.context` (own-harness historyMarks/historyFacts, own-web, own-accounts' meter and idle compaction) and the inbox order against queued prompts. A request-hook filter over a durable metadata marker (approach A) leaves all of these on the pre-reset history: the first compaction after a reset would carry pre-reset text back in through `recent`, and a nearly full session would compact right after its reset (FORK §6.1 rule 1: no plugin API, config or HTTP API can express a history boundary)."
  change: "Round 9 (MR18, v2.4.1 sync, 2026-11-24): upstream moved Session.synthetic into SessionSynthetic.make (also used for Code Mode jobs), delivers subagent reports through SubagentReport's outbox straight into the parent's inbox, starts recovered children through SubagentJob.start and rewrote restart recovery. P-035 follows: SessionSynthetic carries `beforeReset`/`background` and, given `resets` (db, isActive), is the reset-aware notice (`resetBefore`: the earliest applied reset since `startedAt`, else one waiting with no active execution; under the inbox lock); Session and SessionExecution pass `resets`; Code Mode job notices are background without a start; a subagent report is a background notice named by `resetBefore` from the report's `startedAt` and wakes nothing after an applied reset; SubagentJob.start and restart's report delivery keep the job's first start; restart's `resetFirst`/`applyWaiting` and the idle-reset sweep sit on upstream's new suspended-session filter. Inbox item type `reset` (payload {}, always queued): Session.reset (POST /api/session/:sessionID/reset {id?}) commits a staged revert, admits it (a pending one is returned again; a delivered or foreign ID conflicts) and wakes the session. The runner delivers it only between turns (the idle or entering boundary of a turn that is not being continued; never at a step boundary, and steering it conflicts), publishing `session.inbox.delivered` alone; its projection consumes the row, inserts the marker (a completed compaction with id = inbox id, reason `reset`, empty summary and recent, no providerContext, so a boundary for every provenance) and runs InstructionState.advanceEpoch at that seq. The marker renders nothing (toLLMMessages) and is never a previous checkpoint (previousCompaction: the update prompt is not used). Undo (DELETE /api/session/:sessionID/reset/:resetID) cancels a pending reset, or for a delivered one publishes `session.reset.undone{messageID}` (new durable event, version 1), whose projection sets the marker's `undone` time; latestCompaction skips undone markers, so history starts at the boundary before it again. Undo is refused (ResetConflictError -> 409) while a revert is staged, after a later compaction or reset (`superseded`, last in first out) and twice (`undone`), with SessionBusy while running; the checks and the publish run under the inbox lock. estimatePrompt counts no anchor measured after an undone marker before its undo (it covered only the post-reset part). Round 2 (RC-13..RC-22): a pending reset is a barrier (SessionInbox.pendingSteers stops at it, so input admitted after it, steered or queued, delivers after it at every boundary); a deliberate stop (user or inactivity, not shutdown) delivers a reset next in line in the stopping execution (SessionExecution settled hook) and starts no turn; a forced resume first finishes the turn it continues (the reset is not delivered while `force`, and the forced step promotes only the steers before it); after a reset delivers, the drain continues with full delivery, and an interrupt with resume wakes a full drain while a reset waits, so what was queued before it runs first and what follows starts the new context. The delivery projection copies the instruction state's epoch (start seq, baseline values) onto the marker (`baseline`, projection data, so replay derives it again); the undo projection restores it while the reset's own epoch is current, and messageEntries retires the System updates before an undone reset only when its marker lost the baseline (a committed revert or a fork drops it, as does an undo that found the epoch moved), so an undo returns the pre-reset system and prefix byte for byte. Session.reset refuses a subagent session (`subagent`). Session.synthetic takes a background job's `startedAt` (subagent completion, the shell tool): a notice for a job started before a reset (pending, or delivered and not undone) is admitted with resume false and a note. Round 3 (RC-25..RC-29): that notice is passive (`SyntheticPayload.passive`, a new optional schema field): it never promotes on its own and delivers only in the same promotion as other input, in enqueue order, so a boundary with only passive input pending is idle (pendingSteers carries passive rows, nextPromotable skips them, promote publishes them only along with other input); the idle wait is gone. Stops follow upstream again: an interrupt with resume wakes a steer-scoped drain only for a steer or a control (now the reset too) and queued prompts stay parked after any stop; where they stay parked (the settled hook, the resume decision, a steer-scoped drain: nextPromotable `parked`), a queued prompt before a waiting reset does not hold it, while an undelivered steer before it does; a drain that delivers a reset continues in its own scope (round 2's switch to full delivery is removed). Session.reset delivers at once under the inbox lock when the Session has no active execution, ahead of everything pending, and otherwise wakes with the steer scope (SessionExecution.wake gains an optional scope), so a reset never starts a model call of its own. SessionRestart delivers a waiting reset first, without the continuation notice or a forced step, when the cut-off turn holds no message since the last idle. AGENTS.md states these delivery rules next to its delivery vocabulary. Round 4 (RC-33..RC-38): the notice records the reset it precedes instead of a frozen flag: `SyntheticPayload.beforeReset` (replaces round 3's `passive`; Session.notice picks, under the inbox lock, the earliest reset since the job started that still applies, else the waiting one), and a pending row is passive while it carries one; the projections of `session.inbox.cancelled` and `session.reset.undone` drop it from the rows naming that reset (SessionInbox.projectReleased, which repoints them to a reset admitted before them that still waits), Session.cancelInbox and Session.undoReset then wake the Session as an ordinary notice would, and the delivery projection writes the before-reset line only for a row still passive (projection data, no new event; a notice delivered before an undo keeps its line). A deliberate stop delivers a waiting reset ahead of everything pending, steers too, so a stop before and after a reset end alike. The runner no longer parks queued prompts in a steer-scoped drain: it ends at a queued prompt before a waiting reset like upstream, an input wake then runs that prompt in the old context, and without one the settled hook delivers the reset at a succeeded settle and wakes a steer-scoped drain for the steers after it. Restart recovery continues nothing when no user, synthetic or assistant message follows the newest reset marker. Delivering a reset (SessionInbox.deliverReset: the runner, the settled hook, an idle Session.reset) cancels the compaction items admitted before it with the existing `session.inbox.cancelled`. Round 5 (RC-41..RC-45): a background notice records that it is one (`SyntheticPayload.background`, a new optional schema field: Session.notice sets it for a `startedAt`, and restart recovery's shell and subagent notices pass `background` without a start, which only a waiting reset can follow), and the reset's delivery projection names the reset on every pending background notice that names none (SessionInbox.projectOvertaken), so the old turn's result a stop, an idle reset, restart or the settled hook overtakes is passive with the line like one admitted after the reset, while synthetic input a user typed stays ordinary (projection data; cancel and undo release it as before). Delivering a reset cancels every pending compaction item, admitted before it or behind it (the TUI's `/compact`, own-accounts' compact-then-switch and `compaction.due` no longer fail with `Nothing to compact yet`). SessionRestart, when the cut-off turn holds nothing and a reset waits, applies it at once through Session.reset (ahead of parked prompts and old notices, as an idle reset) and wakes a steer-scoped drain, which releases the claim; at startup it applies a reset left waiting at idle without a claim (a death between the stop's terminal and its delivery, a failed turn) unless a revert is staged. Round 6 (RC-48..RC-51): the barrier no longer holds the running turn's background notices: SessionInbox.pendingSteers lets a steered synthetic with `payload.background` that is not passive cross a waiting reset at a boundary inside a running turn (`turn`: after a step, in a forced resume or a continuation; the runner passes it to nextPromotable and promote), so it delivers at that turn's next boundary as without a reset and the reset applies at that turn's end; an entering boundary (a new drain, the settled hook, a stop's resume decision) does not cross, so a reset left waiting while idle applies first. Session.notice no longer names a waiting reset: only a reset that applies since `startedAt` makes a notice passive at admission, and the reset's delivery projection (projectOvertaken) names it on every background notice still pending, admitted before the request or while the reset waited. `POST /api/session/:sessionID/synthetic` (plugins' `ctx.session.synthetic`) takes `background` and `startedAt` (client and OpenAPI regenerated), so own-harness marks its notices. SessionRestart applies a waiting reset it read by its id under the inbox lock and only while it still waits (Session.reset would admit one the user cancelled in between again). SessionInbox.deliverReset publishes the delivery and the compaction cancellations in one publishAll. Round 7 (RC-56..RC-59): a background notice admitted while a reset waits and the Session has no active execution (a failed turn left it) names that reset at admission (Session.notice, under the inbox lock): the job's turn has ended and the next drain applies the reset ahead of the notice, so the inbox shows it passive at once (own-team's readers counted it as work until that drain); the caller's resume stays and a wake only applies the reset. Job keeps a job's first start in its background record (optional `started_at`) and StartInput takes `started_at`, so SessionRestart's recovered shell and subagent notices pass that start (a subagent it resumes keeps it across further restarts) and `background` alone for a record without one; before, a resumed subagent's completion passed the restart time, which missed a reset applied before the restart and woke the parent. Round 8 (RC-65, RC-68): cancelling a pending reset wakes nothing (Session.cancelInbox is upstream's again; Session.undoReset's cancel returns before the release check, which only an undo runs), so a notice it held passive keeps the resume it was admitted with: one admitted without a wake waits for the next input instead of starting a model call. A failed turn leaves no reset waiting at idle (the round-5 and round-7 notes said so wrongly): the reset's wake outlives the failed run, the coordinator starts the next run for it and that run's entering boundary applies it first; a reset waits with no execution only after a restart until recovery applies it, or after a stop that claims its wake while a failing run settles."
  alternatives_rejected:
    - "A: a durable session-metadata marker plus an own request-hook filter: compaction's `recent`, native retained users, due()/estimatePrompt anchors, the instruction epoch, session.context and the inbox order stay pre-reset (see why)"
    - "A new message type for the marker: touches the Info union and every exhaustive switch upstream and in own; a completed compaction is already the boundary for every reader"
    - "Reset through the compact payload: admitCompaction merges a request with a real pending compaction"
    - "Undo after a later compaction by splicing the pre-reset epoch in front of the post-reset checkpoint: history selection is one range from the newest boundary; the update prompt, native windows, P-017 anchors, P-034's kept start and the instruction epoch all assume it. A fork before the marker gives the full earlier context instead"
    - "Undo as an inbox item: more inbox surface for an idle-only operation; revert already uses SessionBusy as the precedent"
    - "A new session with a handoff (own-team rotation style): breaks the same-ID requirement (bindings, cache key, team area)"
