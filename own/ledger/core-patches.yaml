s no stall check: P-018 stays. (4) core location-activity.ts: the sweep touches and keeps a Location that an active execution owns instead of interrupting it; eviction is housekeeping only. (5) core session/execution.ts: an execution that still ends with reason inactivity publishes session.execution.failed {type: session.inactivity} with metadata {reason: inactivity} (claim released, visible, continued by a new prompt) instead of a silent interrupt. own-web shows `이어서` (sends `계속`) under a stalled or timed-out turn's error card and under an inactivity stop (03 §4.5). (6) ai route/executor.ts (2026-11-27, RL31): on a route with chunk false and no explicit progress setting, a response body that has sent only SSE comment lines (`: keep-alive`) for 300 s since its last other byte fails with the chunk timeout's retryable read Timeout (`The response sent only keepalives for 300 seconds`). Silence never arms it (a local server reading a long prompt keeps its unbounded wait); any other byte restarts it; an explicit progress setting replaces it. Real-host phase E (2.4.1-own.3) twice left a team member on a DeepSeek request that only kept the connection open: the relay and forwarder pass comments through and turn a silent upstream into an end within 256 s (measured), so the 10-minute stalls were keepalive-only streams the compat slot waited on without a limit; one harness session in the same run got its first token 1 s into the retry after DeepSeek closed the stream at about 900 s."
