  why: "Three tests in the file failed on this PC, all because they waited for real work in the wrong way. (1) The two 'retains a discovered/configured plugin change during initial activation' tests ran on the TestClock and waited with advance(), which gives up after 100 iterations of setTimeout(1) plus a 500 ms TestClock adjust, about 0.2-1.4 s of real time. What they wait for is real work the TestClock cannot hurry: the rest of the initial activation, then the debounced reload that re-reads config, re-transpiles and imports the plugin and re-runs every built-in setup. It took 110-132 ticks on an ordinary day and about 200 under CPU load, so both failed with 'condition never became true after 100 advances' (10-14 core run; 1 of 6 runs idle and 8 of 8 under 12 CPU burners on 10-16). (2) 'applies organization integration changes to running external plugins' rewrote the config file to drop its deny policy and then published config.updated on the bus. The file's Watcher.testLayer delivers no filesystem events, and Config re-reads its files only on a watch update (or a readiness rescan), so the entries stayed stale and the supervisor kept blocking the plugin. The test passed only when the boot-time readiness rescan, still running beside the initial activation, happened to read .opencode/opencode.json after the rewrite. In the 2026-10-16 flaky round that rescan finished first on every run here, so the test failed with 'pending' every time (5 of 5 in research, and again on this branch). Traced on 10-16: the entries never changed after the bus event; with a 500 ms pause before the rewrite the test failed in the run setup where it had passed; and it passed with TEMP moved (bun run script/test.ts) only because that shifted the timing. TEMP's 80k leftover entries were ruled out: an isolated TEMP with 80k empty files still passed. The product converges: the native watcher reports the save and Config reloads."
