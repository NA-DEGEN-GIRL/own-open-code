- id: P-063
  title: "A child session its creator marks `own.report: false` reports nothing to its parent when it goes idle"
  status: active
  over_budget: true
  exception_required: true
  exception: "Over the active budget of six (own/FORK.md §6.1 rule 5); an H-D6-style additive seam: one more condition beside upstream's automation-run case in SubagentReport.prepare, read from session metadata a plugin sets at creation; no HttpApi, event or schema change. churn_30d: subagent-report.ts 3 (new upstream file, v2.3.0), its test 3. Spans of 3 lines in the source and 32 in the test. No upstream issue/PR is posted; posting needs the user's OK."
  exception_approval: "User delegated core-patch decisions on 2026-10-27 (\"그냥 너가 적합하게 판단해서 자율적으로 진행\"); taken in the v2.4.1 sync (decisions MR18-5) under that delegation."
  files:
    - path: packages/core/src/session/execution/subagent-report.ts
      anchor: "An automation run's child finishes quietly"
      marker: "OWN-PATCH(P-063)"
      churn_30d: 3
      max_lines: 10
    - path: packages/core/test/subagent-report.test.ts
      marker: "OWN-PATCH(P-063)"
      churn_30d: 3
      max_lines: 32
  why: "Since v2.3.0 (#63209, #63413) every child session with a parentID reports to its parent and wakes it each time it goes idle (`<background-result kind=\"subagent\">` steered into the parent); upstream's only exception is an automation run's child. own-harness' Codex agents (collab.ts, collab-v1.ts) are child sessions whose results Codex collects through `wait_agent`/`wait` and the agent mailbox, and own-omo's children are collected by omo's own background manager. With upstream's report each child's idle interrupted the parent's `wait` (`Wait interrupted by new input.`), changed Codex's request sequence and paid for extra model calls (MR18-5). No plugin hook decides whether a child reports."
  change: "SubagentReport.prepare treats a child whose session metadata has `own.report: false` (`SubagentReport.QUIET_KEY`) like an automation run's child: with no Job behind the busy period it releases the claim and reports nothing. Work the parent started through a Job still reports. own-harness sets the key on Codex agents (collab.ts, collab-v1.ts) and own-omo on its children (host/client.ts)."
  alternatives_rejected:
    - "Create Codex and omo children without a parentID: the transcript would lose the child tree, own-web's subagent views and upstream's cancellation of descendants"
    - "Swallow the report in a plugin hook: the report is admitted straight into the parent's inbox by SubagentReport (no Session.synthetic, no hook), and it already woke the parent"
  upstream: { issue: null, pr: null, target_branch: dev }
  commits: []
  verify:
    - "packages/core: bun test test/subagent-report.test.ts (the quiet child test fails without the condition)"
    - "packages/own-harness: bun run test:e2e -- test/e2e/collab.test.ts (Codex waits are not interrupted)"
  remove_when: "upstream offers a per-child opt-out of the parent report (a create option or a hook)"
