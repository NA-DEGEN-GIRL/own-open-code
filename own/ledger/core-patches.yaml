  why: "effect 4.0.6 (upstream v2.2.5) loads node:http in `@effect/platform-node/dist/internal/http.js` through `createRequire(typeof __filename === \"string\" ? __filename : import.meta.url)`. Bun's bundler inlines `__filename` as the source file's absolute path on the build machine. own compiles the SSH-host Linux binaries on Windows (build-remote.ps1, upstream build.ts with OPENCODE_TARGET), so they held `createRequire(\"D:\\…\\http.js\")`, which Linux refuses (`ERR_INVALID_ARG_VALUE`: not an absolute path): `opencode serve --service` died at start on every SSH host (real-host phase A, `service_failed`). Upstream builds its Linux binaries on Linux, where the inlined path is absolute and the require works."
  change: "[v2.4.1 sync (MR18, 2026-11-25): upstream v2.4 embeds each target's Iroh native for machine links (`irohBindingPlugin`); own's Windows-hosted Linux builds stage none, so with `OWN_BUILD_IROH=0` (build-remote.ps1) a Linux target embeds `undefined` as upstream's Intel Mac build does. own runs no machine links (`machines` is off).] An own Bun plugin (`ownFilenamePlugin`, `packages/cli/script/own-filename.ts`) replaces that expression with `import.meta.url` (the module's own URL in every compiled binary; the require loads only node:http and node:https) when the build loads that file, and fails the build if the file no longer has the text."
  alternatives_rejected:
    - "Define `__filename` for the whole build: other modules use it for their own paths"
    - "Compile the Linux binaries on a Linux host: the release builds on this PC, and the SSH host is a test host"
