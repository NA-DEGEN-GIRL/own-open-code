- id: P-033
  title: "PTY exit codes from 0x80000000 up keep the unsigned Windows code"
  status: active
  over_budget: true
  exception_required: true
  exception: "Over the active budget of six (own/FORK.md §6.1 rule 5), and NOT covered by H-D6 (a bug fix in the PTY service, not a harness seam). churn_30d 1 (core pty.ts) and 0 (the new test file, whose marker span holds 47 lines, cap 30). Counted on upstream-v2 over the 30 days before `added`. The public schema and HttpApi stay as they are, so the client is not regenerated. No upstream issue/PR is posted; posting needs the user's OK."
  exception_approval: "Approved 2026-10-22 by the user (SR-16 (1), negative PTY exit codes): \"정해줄거 … 고치도록\" — fix it with a core patch. own/handoff/decisions-2026-10.md PX."
  files:
    - path: packages/core/src/pty.ts
      anchor: "proc.onExit((event) => {"
      marker: "OWN-PATCH(P-033)"
      churn_30d: 1
    - path: packages/core/test/pty/pty-exit-code.test.ts
      marker: "OWN-PATCH(P-033)"
      churn_30d: 0
      max_lines: 47
  why: "A Windows exit code is a 32-bit DWORD. bun-pty (and @lydell/node-pty) report one from 0x80000000 up as a negative number: NTSTATUS 0xC0000005 (a crashed program) as -1073741819, `wsl.exe` without a distribution as -1, PowerShell 7.6.6's FailFast in a ConPTY (0x80131623) as -2146232797. Core stored that number in Pty.Info.exitCode and pty.exited, which are NonNegativeInt, so the response encoder of GET /api/pty (and GET /api/pty/:id) answered 400 for the whole folder: own-web showed no terminal (`터미널을 만들지 못했어요`), and own-team's extended safe point read the folder as unsafe until the PTY was removed. Found in the streaming render round (SR-12, SR-16 (1))."
  change: "The PTY exit handler takes `event.exitCode >>> 0` once and uses it for Info.exitCode, the pty.exited event and the attachments' onEnd: the unsigned code Windows reports (3221225477 = 0xC0000005, the form Windows documents), and POSIX codes (0-255) unchanged. Schema, protocol and HttpApi do not change."
  alternatives_rejected:
    - "Widen Info.exitCode and pty.exited to Int (any safe integer): a public schema change (the client and its OpenAPI regenerate, other clients see a type change), and clients still get a value that matches no Windows documentation (-1073741819 instead of 0xC0000005)"
    - "Normalize in the schema with a transformation: Info is shared by core, server and clients; the value belongs to the exit handler, the one place that writes it"
    - "Also leave records the public schema rejects out of the list route: after the change no record can carry a bad exit code (the handler is the only writer and PTY records live in memory only, so no record from before the change survives a server restart), it would hide a running terminal from own-web and turn own-team's fail-closed safe point (a failed list is unsafe) into a silent pass, and only a stub Pty service could test it"
    - "Normalize the persistent PTY daemon's exit_code on read (persistent-pty/index.ts toInfo): the daemon ships no Windows binary and POSIX codes are 0-255"
  upstream: { issue: null, pr: null, target_branch: dev }
  commits: ["1735b96592"]
  verify:
    - "cd packages/core && bun run script/test.ts test/pty/pty-exit-code.test.ts (Windows; fails without the change: pty.exited carries -1073741819)"
    - "cd packages/own-web && bunx playwright test --config e2e/terminal/playwright.config.ts -g NTSTATUS (Windows, local)"
    - "node own/scripts/check-ledger.mjs"
  remove_when: "upstream keeps Windows exit codes from 0x80000000 up (normalizes them or widens the schema)"
  added: 2026-10-22

- id: P-034
  title: "Summary compaction can send the whole history first, the session's cached prefix"
  status: active
  over_budget: true
  exception_required: true
  exception: "Over the active budget of six (own/FORK.md §6.1 rule 5), approved as an H-D6-style seam. churn_30d 7 (core session/compaction.ts), 13 (core session/model-request.ts) and 8 (its test) exceed the <=5 rule; the compaction.ts blocks span 122 lines (cap 30; some nested in P-025's summarize block, whose span counts them too) and the test block 368. The v2.2.1 sync grew the source blocks from 112 lines: upstream v2.1 runs the compaction hooks on the whole history and cuts the request at the kept part afterwards, so P-034 now chooses whether to run the hooks a second time on the older part and keeps the measured count only for the unchanged whole request. About 50 source lines were designed (own/reports/cached-compaction-2026-10.md §3.4); the adversarial review's corrections add the rest: the fit check and output room by the provider's last count instead of the text estimate (P5, P6), the price-tier check (P4), the whole-history case without a kept part (P1), the one-shot attempt that falls back with its failure recorded (P6), the per-compaction record of the request used, and the promise plugin type (own-accounts' hook writes metadata). The live-phase review (CC-12, CC-13) adds the fixed-thinking-budget check, the real window for the fit check, a declining hook's reason, the record on stand-in and model-free checkpoints and the `flattened` record; its follow-up review (CC-16) adds a hook's `cancel` (five lines), which own-accounts uses to drop an idle compaction that delivered too late. Counted on upstream-v2 over the 30 days before `added`. No upstream issue/PR is posted; posting needs the user's OK. Without a hook asking, core sends exactly today's request (tests)."
  exception_approval: "Approved 2026-10-24 by the user (CC (1)): \"바꾸기\" — P-034, cache-preserving full-prefix summary compaction, as an H-D6-style exception. own/handoff/decisions-2026-10.md CC."
  files:
    - path: packages/core/src/session/compaction.ts
      anchor: "    const fullPrefix = Effect.fnUntraced(function* ("
      marker: "OWN-PATCH(P-034)"
      churn_30d: 7
      max_lines: 122
    - path: packages/core/src/session/model-request.ts
      anchor: "      compaction: (input) =>"
      marker: "OWN-PATCH(P-034)"
      churn_30d: 13
    - path: packages/plugin/src/effect/session.ts
      anchor: "  prefix?: \"full\""
      marker: "OWN-PATCH(P-034)"
      churn_30d: 2
    - path: packages/plugin/src/promise/session.ts
      anchor: "export interface SessionCompaction extends SessionContext {"
      marker: "OWN-PATCH(P-034)"
      churn_30d: 2
    - path: packages/core/test/session-compaction.test.ts
      marker: "OWN-PATCH(P-034)"
      churn_30d: 8
      max_lines: 383
  why: "The summary request is the last primary request cut where the kept recent part starts, plus the prompt (P-025). Anthropic (API key and the Claude subscription) reads only cache entries a request wrote at a breakpoint within 20 positions, so the older request reads the entry of the recent part's first requests, which cover its end; measured 2026-10-24 (own/reports/cached-compaction-2026-10.md §9) at 95-97% when warm, where the whole history cost slightly more. It misses when the kept part is longer than the lookback (an agent turn of more than about ten tool calls) and the requests covering the older end started more than five minutes ago: then everything after the system prompt and tools is written again at 1.25x (S1: 71-72%; Opus 5.5, 900k: about $4.45 instead of $0.28). Sending the whole history, byte for byte as the next primary request, reads the previous request's tail entry instead (S1: 98%). A plugin cannot do it: since upstream v2.1 the hooks see the whole history, but core cuts the request where the kept part starts afterwards (`withoutTail`), and at the auto trigger the whole context is over core's budget check and would be flattened; only core can send it whole and fit it to the window."
  change: "SessionCompaction (Effect and promise plugin types) gets `prefix?: \"full\"` and a read-only `kept?: {messageID}`; the promise type also gets the Effect type's `metadata`. Summarize runs the compaction hooks on the whole history first, as upstream does, with `kept` set (model-request's compaction entry passes it and `prefix` into the event); a hook may set `prefix: \"full\"`, or clear it and name why as `metadata.prefix.reason`. When a hook gave its own prompt (P-025) and something is kept, the hooks run a second time on the part before the kept message, which becomes the older request with its own prompt and cache hints; a stand-in model only ever sends that one. The full request goes first, once, only when the trigger is not overflow, the request has no fixed thinking budget (`thinking: {type: \"enabled\", budget}` from the route's and model's default provider options or the request's: Claude 3.7 and 4.0-4.5, variant.ts `claudeInfo.manual`, drop earlier turns' thinking after a plain user message, and fitThinkingBudget may cut the budget to this request's smaller output limit), the hook still asks and gave a prompt, the request fits the model's real window (`limit.context`, else `limit.input`: own-accounts registers a lowered trigger's window as `limit.input`) minus RESERVE_MIN by estimateContext (the provider's last count, P-017) plus the prompt, and it does not cross a model cost tier the older request stays under. Its output limit is the room that count leaves. Any failure (an error, a cut or unusable reply) goes straight to today's older request with no retry of its own. Core records what became of it in the checkpoint's metadata as `prefix: {request: \"full\"}` or `{request: \"older\", reason: overflow|thinking|declined|<the hook's reason>|fit|tier|failed|flattened}`, also on a stand-in's or the model-free summary's checkpoint; without `kept` (nothing kept, the older part is the whole history) it records `full`, or `flattened` when deliver sends that history as text. A compaction hook may also set `cancel` (a message): the compaction then fails as cancelled (`aborted`) before any request, with no stand-in model or `fallback`, summary and provider-native compaction alike (own-accounts drops an idle compaction that delivered only after its cache cooled or the user came back, CC-16). Without a hook setting `prefix` or `cancel` nothing changes: same request, same event, no record. Provider-native compaction is unchanged otherwise; no tool_choice is set and tools stay."
  alternatives_rejected:
    - "Append the kept part in own-harness after the hooks: own-accounts' hooks (strip rules, hints) would have run on `older` only, so the bytes would differ from the primary request"
    - "Always prepare the whole history: changes what existing hooks see (H-D6)"
    - "Send the whole history whenever the cache is warm (the first version, d59fff9816 with own-accounts' verdict): measured 2026-10-24, the older request already reads 95-97% on Anthropic then and the whole history's input costs more (+$0.0004-0.0016 per compaction); ChatGPT, a longest-prefix cache, was mixed (W1 input 0.29 -> 0.24 credits at 89.1% -> 94.5%, W3 0.19 -> 0.25; totals equal or set by the summary's length); own-accounts now asks only on the Anthropic engine for a kept part the older request would miss (CC-12, CC-16)"
    - "Send the compaction over ChatGPT's session WebSocket as a continuation: unverified whether HTTP and the socket share a cache, and the socket's continuation baseline would become the compaction reply; kept on HTTP until the live measurement (S3), and own-accounts keeps codex over WebSocket on the older request"
  upstream: { issue: null, pr: null, target_branch: dev }
