  why: "own.accounts' GitHub connection (own/docs/16-github.md §6) gives git in the shells core starts the GitHub login of the account a conversation chose, `off` included. Core's shell hook (`shell` `create.before`, packages/core/src/shell.ts) had the folder, the command, the timeout and the environment but not the conversation: core's shell tool and the session shell pass `metadata.sessionID` to `Shell.create`, which never reached the hook. So in the opencode and omo harnesses (whose shell is core's) a conversation's own choice, `off` too, was ignored and the folder's account logged in (review finding M1, 2026-11-01). The other harnesses' shells are own's and already knew the conversation."
  change: "core shell.ts: the `create.before` invocation carries `sessionID` when the command's `metadata.sessionID` is a session id (core's shell tool, the session shell), and since 2026-11-01's second review (GH-27) the command's `id`: the id is made before the hooks run instead of after them (the same `Shell.ID.ascending()`, a few lines earlier), so `Shell.Info.id` and the `shell.exited`/`shell.deleted` events name what the hooks saw. @opencode/plugin effect/shell.ts and promise/shell.ts: `ShellCreateBefore.sessionID?` and `ShellCreateBefore.id?` (read-only). own-accounts' shell hook resolves that conversation's account (its root conversation's), `off` included; a command without one gets the folder's account only where no conversation in or around that folder chose otherwise lately, so without this patch the hook fails closed. The command's git login ends with its `shell.exited` (or `shell.deleted`) and counts its time from its first use, so a command the user approves late or moves to the background keeps it (without the id, a command keeps it for its timeout plus a minute, or an hour, from its first use). Since 2026-11-03 (merge round 10's final verification, finding 3; decisions MR12-3) `shell.created` carries the spawned process's id (`command.info` instead of the `info` made before the spawn, whose `pid` was unset): on an SSH host own-accounts binds the command's git ticket to that process (`<pid>:<start time>`) when the command starts, so a command that read the ticket out of the first one's environment and started itself again with it (`exec` rewrites `/proc/<pid>/environ`) is refused even when it asks first (GH-48)."
  alternatives_rejected:
    - "Read `OPENCODE_SESSION_ID` from the event's environment: core's shell tool sets it in its own `before` callback, after the hooks run, and the session shell never sets it"
    - "Match the command to a running tool call by command text and folder: two conversations may run the same command in one folder"
    - "Fail closed only (no patch): a conversation that chose an account other than its folder's could never use git logins in the opencode and omo harnesses"
    - "For the id: a git login that lives the command's timeout plus a minute from its making (the first version): it lapsed before a command the user approved after that, and in a command moved to the background (review gw1); matching `shell.created` to the hook's call by command text and folder: two commands may be the same"
  upstream: { issue: null, pr: null, target_branch: dev }
  commits: ["06dec13b13", "8a52b64235", "b2ef672a05"]
