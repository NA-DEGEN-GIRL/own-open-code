hecked real path, set only after own-accounts' check passed) is its own real path and the account folder's `projects` resolves to it, and then works in that path, not through the link; appends go only to single-link plain files in real folders (CAG-44); refusals are Korean; otherwise the sweep and removals skip with a warning and a write fails the request. Session ids from file names must be uuids (a `.jsonl` or `...jsonl` would name the project folder or the link), and a project folder that is a link is refused."
