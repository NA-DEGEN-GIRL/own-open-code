- id: P-016
  title: "Script-aware Token.estimate (Hangul and CJK)"
  status: active
  files:
    - path: packages/core/src/util/token.ts
      anchor: "const CHARS_PER_TOKEN = 4"
      marker: "OWN-PATCH(P-016)"
      churn_30d: 0
      max_lines: 11
    - path: packages/core/test/util/token.test.ts
      anchor: 'describe("Token.estimate", () => {'
      marker: "OWN-PATCH(P-016)"
      churn_30d: 0
      max_lines: 32
  why: "Token.estimate counts length/4, but a Hangul syllable or CJK character is one UTF-16 unit and costs about 0.6 tokens, so Korean text was estimated at about 40% of its size. Compaction uses the estimate for the unsent tail, for the whole history when no same-provider count exists (every own account is its own providerID, so after each account switch), for the 15k keep tail and the flatten budgets; after upstream d9987ef9c8 also for the output limit (window - estimate x 1.15). Korean sessions could therefore compact late, overflow and keep a larger tail than intended (research r3 F3)."
  change: "estimate = 0.65 x Hangul code points + 0.6 x other CJK code points + rest / 4, rounded. Hangul = jamo, compatibility and extended jamo, syllables and half-width Hangul; other CJK = CJK radicals to unified ideographs incl. kana, bopomofo and CJK symbols, compatibility ideographs and forms, full-width forms; astral ideographs (two UTF-16 units) stay in the rest at about 0.5 each. Text without those characters gets the upstream value. Cost: two regex replaces over the text."
  calibration: "Measured 2026-10-07 on the user's real accounts (own/reports/token-density-2026-10-07.md, 8 one-turn requests): Hangul 0.683 (gpt-6-luna) and 0.791 (deepseek-flash) tokens per character, other CJK 0.751 and 0.620. Each weight sits just below the lowest measurement so compaction never starts before the window is full (R8): Hangul 0.65, other CJK 0.6. The old single 0.6 counted Korean 11-22% low. Two-sided since upstream d9987ef9c8 (v2.0.24): the same estimate also sizes the output limit, maxTokens = min(output, context - measured - ceil(estimated x 1.15)) (core/src/session/model-request.ts outputLimit), where a low estimate is the unsafe direction, so weight x 1.15 must also cover the highest measured density of every slot kind that still receives maxTokens. Hangul 0.65 x 1.15 = 0.7475 covers gpt-6-luna (0.683; codex and oai drop maxTokens, NO_OUTPUT_LIMIT) but not deepseek-flash (0.791): on a ds slot whose output limit is room-bound (1M window, 256k requested: from about 744k up to the 900k ceiling), unmeasured Korean text (a new user message or tool result) can push prompt + max_tokens past the window by about 5% of that text. A provider that enforces the sum then rejects the step; OpenAI-compatible wording matches core's overflow patterns and compacts early (R8), Anthropic's does not and fails the step. Exposed kinds: ds, anth, xai, or, compat (siwc strips maxTokens). Unverified against the live DeepSeek API (same open item as D2's 256k value); the choice (raise the Hangul weight to about 0.69, which compacts earlier on gpt-6-luna; drop or cap maxTokens for ds in onRequestShape; or accept and document) is the user's (own/ledger/SYNC_LOG.md v2.0.24)."
  approval: "Approved 2026-10-07: the user asked for optimal token estimation and allowed measuring with real accounts; the weights come from that measurement."
  follow_up: "Optional: re-run bun own/scripts/db-stats.ts (read-only) once the own database holds many Korean sessions and adjust the two weights from report 1 (own/FORK.md §12 Q18)."
  alternatives_rejected:
    - "Plugin-side estimate: core compaction (due, keep tail, flatten budgets, output limit) calls Token.estimate directly and no hook replaces it"
    - "A real tokenizer per model: megabyte tables that differ per provider and are unpublished for some models (GPT-6, DeepSeek V4); the measured usage anchor already covers sent history"
    - "1 token per Hangul/CJK character (research r3): overestimates o200k Korean by about 60%, so compaction would start long before the window is full (R8)"
  upstream: { issue: null, pr: null, target_branch: v2 }
  commits: ["d337df7c45"]
  verify:
    - "cd packages/core && bun test test/util/token.test.ts"
    - "bun own/scripts/db-stats.ts on a database with Korean sessions: report 1's P-016 row has wH and wC near 0.6 and a Σ ratio nearer 1 than length/4; otherwise change DENSE_TOKENS_PER_CHAR (or split the CJK weight)"
  remove_when: "upstream makes Token.estimate script-aware or uses provider token counts for the whole history (upstream v2 PR candidate; posting it needs the user's OK)"
  added: 2026-10-06

- id: P-017
  title: "Keep the measured token anchor across providers of the same model (account slot switch)"
  status: active
  exception_required: true
  exception: "churn_30d 20 (compaction.ts), 16 (its test) and 9 (runner/llm.ts, added to the patch at the v2.0.24 sync) exceed the <=5 rule (own/FORK.md §6.1 rule 2). Counted on the upstream-v2 mirror at e1b7299bc9 over the 30 days before `added`; the earlier 00d179015f mirror counted 17 and 12. Source lines between markers grew to 34 + 4 when the runner path joined, over rule 2's 30-line cap; the runner file and the 38 lines were accepted on 2026-10-08 with the v2.0.24 sync's task direction (same intent as the approved patch; own/FORK.md §12 Q19 (c)). The user approved this patch on 2026-10-05 (token estimation decision). The upstream issue/PR the rule asks for first is not posted; posting it needs the user's OK."
  exception_approval: "Approved 2026-10-07 by the user: P-017 stays an own patch without an upstream issue (waiver of the upstream-first rule for this patch only; the patch exists because own registers each account as its own provider). The two deviations are accepted: the tokenizer signal is the catalog model id, and opaque provider items from another slot may be counted (that errs high, the safe direction)."
  files:
    - path: packages/core/src/session/compaction.ts
      anchor: "if (measured < messages.findLastIndex(SessionProviderContext.isCheckpoint)) return false"
      marker: "OWN-PATCH(P-017)"
      churn_30d: 20
      # 34 of P-017's own and 5 of P-035's, nested in estimatePrompt (no anchor counted while an undone reset hid history).
      max_lines: 39
    - path: packages/core/src/session/runner/llm.ts
      anchor: 'toolChoice: stepLimitReached ? "none" : undefined,'
      marker: "OWN-PATCH(P-017)"
      churn_30d: 9
      max_lines: 4
    # SessionHistory.latestCompaction is module-private since upstream v2.1; sharesMeasuredPrompt reads it (v2.2.1 sync).
    - path: packages/core/src/session/history.ts
      anchor: "export const latestCompaction = Effect.fnUntraced(function* ("
      marker: "OWN-PATCH(P-017)"
      churn_30d: 6
      max_lines: 1
    - path: packages/core/test/session-compaction.test.ts
      anchor: 'it.effect("forked session compaction reuses the fork root prompt cache key", () =>'
      marker: "OWN-PATCH(P-017)"
      churn_30d: 16
      max_lines: 70
  why: "estimateContext trusts only usage measured by the session's current providerID. Every own account slot is its own providerID (02 §2.2 R-ID-1), so after each account switch auto compaction re-estimated the whole history from text (Token.estimate; length/4 before P-016, about 40% of Korean) instead of the provider's count plus the unsent tail, and could start late and overflow. Upstream's only stated reason for the providerID rule is a native window the new provider cannot replay."
  change: "sharesMeasuredPrompt(db, context) (exported) is true when the session's newest completed compaction (SessionHistory.latestCompaction 'latest') is the one this model's history starts from (latestCompaction with the SessionContext.load boundary, provenance ?? 'local') and context.messages holds no native checkpoint. SessionCompaction.compact passes it to due() and to the overflow budget's estimateContext(context, shared); estimateContext and estimatePrompt(context, shared) pass it to hasMeasuredPrompt(message, ref, shared), which then also accepts an assistant count whose Model.Ref.id equals the current model id. The runner (session/runner/llm.ts) passes it to estimatePrompt for the output limit of every primary step (upstream d9987ef9c8: maxTokens = min(output, context - measured - ceil(estimated x 1.15))). Two indexed queries (session_id, type, seq) per call, so four per step (compact's auto check and the output limit). estimateContext/estimatePrompt without `shared` and the due() checkpoint wait keep the upstream behavior."
  tokenizer_signal: "Same catalog model id (Model.Ref.id). Assistant messages record only the Ref, so the counting provider's package or API model id is unknown without a catalog lookup. A catalog id names the served model, so its tokenizer; own slots of one kind share package, canonical provider and model entries; upstream already trusts same-provider counts across model ids."
  deviations: "Two departures from GW-P17A's acceptance, accepted by the user on 2026-10-07 (exception_approval, own/FORK.md §12 Q19): (1) the acceptance lists provider-specific opaque items after the last compaction as a case not to reuse counts in ('when unsure, fall back to the estimate'); P-017 reuses the other slot's count anyway and accepts the mostly-upward error of safety (3), which can compact one step early after a switch. (2) The tokenizer signal is the catalog model id alone and applies to every provider, not only own slots; the plan suggested model id plus API package. Two unrelated providers serving one generic model id (OpenAI-compatible or local servers) can therefore share a count. Tightening (2) needs the counting provider's package, which assistant messages do not record (see alternatives_rejected)."
  merge_note: "Re-applied in the upstream v2.0.24 merge (257a07b520, 2026-10-07). d9987ef9c8 turned estimateContext into estimatePrompt returning {measured, estimated} (estimateContext now sums it), and cb389aa679 resolves the compaction agent's model for the summary ceiling and cap; `shared` stays computed for the session model (context.model), whose history and anchor it describes. Decision on the runner's output-limit path: pass `shared`. Without it the first step after a switch between slots of one model has measured = 0 and estimates the whole history from text, and P-016's weights sit just below the measured densities (Hangul 0.65 vs 0.68-0.79), so Korean history could be counted up to about 20% low, the output limit could exceed the room left, and the provider's rejection would start an overflow compaction before the window is full (R8). A shared count that runs high only lowers the output limit (floor 1,024)."
  safety: "(1) A native window made by another provider is left out of this model's history (SessionHistory replayable), which holds the original messages instead, so that provider's later count is too low. Only a native compaction can be newer than the compaction this history starts from (summaries replay everywhere), so any newer completed compaction disables sharing. (2) This model's own native window at the start of history: another provider counted the expanded messages instead (too high), so a checkpoint in context.messages disables sharing; due() already waits for this provider's count after one. (3) Provider state that only the producing providerID+model replays (encrypted reasoning, thinking signatures, item ids; to-llm-message.ts sameModel) reaches the other slot as plain reasoning, as text (Anthropic demotes unsigned thinking) or not at all. That shifts the count by about the reasoning a request carries, mostly upward, the same approximation upstream makes by adding the anchor's own reasoning tokens. (4) The identity system part names the providerID (D9 normalizes it, 02 §4.3). Native compaction mechanisms are unchanged (own slots use summary compaction, 02 §8)."
  alternatives_rejected:
    - "Compare package, canonical provider and API model id through Model.Service: a new compaction dependency and per-provider catalog lookups (retired slots leave the catalog) for a case a shared catalog id already rules out"
    - "Plugin side: due() and the overflow budget pick the anchor inside core compaction; no hook supplies a token count"
    - "One providerID for all slots of a kind: breaks R-ID-1 (account A's encrypted reasoning replayed to account B, 02 §2.2)"
    - "Block sharing whenever per-message provider state exists: nearly every reasoning step carries it, so slots would never share a count"
  upstream: { issue: null, pr: null, target_branch: v2 }
