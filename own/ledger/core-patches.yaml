  title: "Code Mode's fetch passes on only method, headers and body"
  status: active
  over_budget: true
  exception_required: true
  exception: "Over the active budget of six (own/FORK.md §6.1 rule 5). A security fix inside a cherry-picked file (b5b9bddb54, cherry-picks.yaml): no hook, schema or caller changes. churn_30d 1 (fetch.ts; upstream-v2, counted over the 30 days before `added`) and 0 (the new test). Three spans in fetch.ts of 34 lines together (the option check, the request and `display`) and 79 in the test; the release fix RL2-M1 (2026-11-03) grew them to 115 lines in fetch.ts (the normalisation, the forbidden lists, the redirect hop's display) and 170 in the test. upstream dev (056d5f0343) has the same spread; no upstream issue/PR is posted, posting needs the user's OK."
  exception_approval: "User delegated core-patch decisions on 2026-10-27 (\"그냥 너가 적합하게 판단해서 자율적으로 진행\": decide core patches without stopping to ask, record them in this ledger and the decisions log, report each one). The task of 2026-11-03 (merge round 10's final verification, finding 1) asked for this change; own/handoff/decisions-2026-10.md MR12-1."
  files:
    - path: packages/core/src/codemode/fetch.ts
      anchor: "const fetch = (input: string | URL, options?: unknown) =>"
      marker: "OWN-PATCH(P-049)"
      churn_30d: 1
      max_lines: 116
    - path: packages/core/test/codemode-fetch-options.test.ts
      marker: "OWN-PATCH(P-049)"
      churn_30d: 0
      max_lines: 171
  why: "Code Mode's `fetch` (packages/core/src/codemode/fetch.ts, upstream bdca40ac0e and the cherry-picked b5b9bddb54) asks `webfetch` for the URL and then called `globalThis.fetch(target, { ...request, redirect: \"manual\", signal })` with the program's options spread in. Bun's fetch takes `proxy`, `unix` and `tls`, so a program (after a prompt injection) could send an approved URL, with its headers and body, through a proxy of its choosing or to a local socket (a Docker or service socket), past every webfetch rule, which match only the URL."
  change: "The fetch takes only `method`, `headers` and `body` from the program, plus its own `redirect: \"manual\"` and `signal`; options that are not an object, or any other key, fail the call before anything is asked or sent (`fetch does not support the option proxy: only method, headers and body are allowed.`). The approval's metadata (`display`) also names the headers the request sends and the body's size in bytes (`headers`, `bodyBytes`, only when present), which own-web's webfetch card shows. RL2-M1 (2026-11-03): the options are read once (`normalise`) into the one value both the approval's `display` and the request use, so the card never shows less than what is sent: `method` must be a string (upper-cased; CONNECT, TRACE and TRACK refused), `headers` become `Array.from(new Headers(init.headers))` (objects, Headers, Maps and arrays of pairs; anything the constructor refuses fails before the ask) minus the Fetch standard's forbidden request headers (`Host`, `Connection`, `Content-Length`, `Transfer-Encoding`, `Cookie`, `Origin`, `Proxy-*`, `Sec-*`, a method override naming a forbidden method, …), `body` must be a string, a Uint8Array or URLSearchParams; a redirect hop's check shows the request sent there (credentials dropped for another origin)."
  alternatives_rejected:
    - "Drop only `proxy`, `unix` and `tls`: Bun may add options; an allow-list stays closed"
    - "Ignore unknown keys silently: a program would not learn that its option had no effect"
  upstream: { issue: null, pr: null, target_branch: dev }
  commits: ["022abd0825", "3ff91d52fc"]
