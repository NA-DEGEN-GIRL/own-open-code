  exception_approval: "User delegated core-patch decisions on 2026-10-27 (\"그냥 너가 적합하게 판단해서 자율적으로 진행\": decide core patches without stopping to ask, record them in this ledger and the decisions log, report each one). Taken under that delegation on 2026-10-28 for the real-host phase E failure of 2.0.32-own.6 (own/handoff/decisions-2026-10.md RH-8…RH-14)."
  files:
    - path: packages/core/src/location-activity.ts
      anchor: "const isSessionEvent = Schema.is(SessionEvent.Durable)"
      marker: "OWN-PATCH(P-037)"
      churn_30d: 0
    - path: packages/core/test/location-activity.test.ts
      anchor: 'describe("LocationActivity resident Locations", () => {'
      marker: "OWN-PATCH(P-037)"
      churn_30d: 1
  why: "Real-host phase E of 2.0.32-own.6 (2026-10-28) failed after 4,339 s: own's control Location (OWN_HOME/control) holds the process-lifetime work of own's plugins (own-remote's SSH controller and its tunnels, own-accounts' credential broker and its hosts, the leaders of own.accounts, own.remote and own.team) but never a session. LocationActivity (core location-activity.ts) keeps a Location only while durable session events touch it, so it evicted the control Location 61 minutes after it booted whatever that work was doing: on the host at 08:28:31Z (inferred, the host's logs went with z-cleanup: the remote service's own.accounts control instance started again without a process restart and re-read its compat servers, and the last area still working in the team's second round stopped 49 s later) and on this PC at 08:53:19Z (`location services evicted`, then `own.accounts.broker disconnected` two seconds later; the tunnel's local port refused every later request). The next request booted the Location again with fresh plugin instances, but the tunnels and broker connections it had held were gone. Runs that ended within the hour never saw it, which is why earlier E runs passed."
  change: "core location-activity.ts: `LocationActivity.RESIDENT` = Symbol.for(\"opencode.location-activity.resident\"), a `globalThis` set of directories (plugins are separate bundles with their own module copies, so a registered symbol is the only shared place). The sweep leaves out of `expired` any entry whose Location has no workspace and whose directory matches a registered one (resolved; case-insensitive on Windows), so such a Location stays for the life of the process. Nothing else changes: other Locations expire as before, an explicit invalidate (DELETE /api/debug/location) still evicts, and an empty registry is upstream's behaviour. own-runtime `Runtime.acquire` adds `OWN_HOME/control` to the set; every own plugin (own-accounts, own-remote, own-team, own-telemetry) acquires the runtime, so every process that loads one (the PC service, the remote service, test stacks) keeps its control Location."
  alternatives_rejected:
    - "Pin each own singleton past Location eviction, as own-remote's gateway already does: one pin per plugin and per resource (controller, broker hosts, the team and accounts leaders, the remote broker client), the leaders still move to another instance and back, and a Location that comes back has fresh plugin instances next to the pinned work"
    - "Count RPC requests as activity: nothing calls the control Location while a remote team works and the app is closed, and the PC's tunnels carry no request through it"
    - "A hidden session in the control Location to keep it touched: a fake session in every list, store and import"
    - "Raise LocationActivity's time-to-live: the work still stops, only later"
    - "An environment variable naming resident directories: the PC app, the remote service's config and every test stack would each have to repeat OWN_HOME's layout"
