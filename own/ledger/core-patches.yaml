- id: P-036
  title: "Markdown frontmatter is YAML only: gray-matter's script engines never run"
  status: active
  over_budget: true
  exception_required: true
  exception: "Over the active budget of six (own/FORK.md §6.1 rule 5), and NOT covered by H-D6: it changes existing core behaviour (a language token other than yaml/yml after the opening `---` now fails like malformed YAML; upstream parses `---json` and evaluates `---js`). churn_30d 1 (core config/markdown.ts, upstream d5154fb74e) and 0 (the new test file, whose marker span holds 137 lines, cap 30); markdown.ts's two spans hold 18 lines. Counted on upstream-v2 over the 30 days before `added`. FORK §6.1 rule 2 wants an upstream issue or PR first: the issue is drafted (own/reports/upstream-gray-matter-eval.md) and, by the user's decision, not posted (upstream's SECURITY.md bans AI-written security reports and treats malicious config files as out of scope)."
  exception_approval: "Approved 2026-10-25 by the user: P-036 \"넣기 (권장)\" (include it in this build), and the upstream issue \"올리지 않기 (권장)\" (do not post). own/handoff/decisions-2026-10.md SK2-C1."
  files:
    - path: packages/core/src/config/markdown.ts
      anchor: "export function parse(content: string) {"
      marker: "OWN-PATCH(P-036)"
      churn_30d: 1
    - path: packages/core/test/config/frontmatter-language.test.ts
      marker: "OWN-PATCH(P-036)"
      churn_30d: 0
      max_lines: 137
  why: "ConfigMarkdown.parse called gray-matter with its default engines (`matter(content, {})`). gray-matter reads a language token after the opening `---`, and its default `javascript` engine (`---js`, `---javascript`) runs the block with eval() in the server process, with the CommonJS `require` in scope. ConfigMarkdown parses every Markdown agent and command of every config directory (global, system, the project's `.opencode`) and every SKILL.md core loads: a config directory's `skill`/`skills`, `skills` paths and downloaded URL sources, and the Claude and Agents compatibility roots (`~/.claude/skills`, `~/.agents/skills`, the project's `.claude/skills` and `.agents/skills`). So a skill copied from a marketplace or a git repository, which the user takes as prompt text, ran code when core loaded it. Project `.opencode/plugin(s)` files already run code when a folder is opened, so the project roots add little upstream; the home and compatibility skill roots, URL skill sources and own-import's copies are outside that trust, and in own the `---js` route also bypasses the Location plugin allowlist (01 §13.2 (a)): no plugin is listed, so no `untrusted_plugin` alert is raised. Before the change the new test's `---js` blocks write their marker from six skill roots (the project's `.opencode`, `.claude` and `.agents`, the home's `.claude` and `.agents`, the global config directory), the agents folder and the commands folder."
  change: "ConfigMarkdown.parse calls gray-matter with `engines: {javascript, coffee}` that throw before anything runs, and fails a parse whose `file.language` (the token after `---`, `yaml` when there is none) is not yaml/yml, case-insensitively, like malformed YAML. The first parse and the sanitize retry both go through it, so parseOption returns undefined and the existing paths apply: the skill file is skipped (the config skill plugin logs `skill file skipped`, reason `markdown`, at debug), the Markdown agent or command is left out. YAML frontmatter, its colon retry and gray-matter's content-cache bypass are unchanged."
