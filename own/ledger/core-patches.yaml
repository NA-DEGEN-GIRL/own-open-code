  why: "Every Location loads its own copy of each local plugin: `prepareSource` walks the import graph with `Bun.Transpiler.scan` before the module is evaluated again. own's release plugins are bundles of 11 MB together, and their scan took 0.4-0.6 s of CPU for every Location, the same result every time (release 2.2.6-own.3 profile: 670 ms of 2.6 s of JavaScript in a new folder's activation; microbench 430-570 ms per Location). A new folder's first session open after a service start, or after the 60-minute idle eviction, waits for that activation in the composer's own.accounts reads (2.1-4.4 s on the release build under 70-100 % CPU)."
  change: "source.bun.ts keeps, per process, each scanned file's import list with `Bun.hash` of the text it was scanned from; a later Location reading the same text reuses the list, any other text is scanned again. The file is still read, hashed for the watcher digest, tracked and evaluated as before, so reload and watch behaviour do not change. Later Locations: scan + digest 430-570 ms -> 45-51 ms (microbench); the scan is gone from a new folder's activation profile (470 ms -> 10 ms in source.bun.ts)."
