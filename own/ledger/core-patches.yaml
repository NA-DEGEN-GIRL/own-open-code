  why: "The service starts pwsh/powershell without a console, so PowerShell writes its output in the OEM code page (CP949 on Korean Windows) while core reads shell output as UTF-8. Hangul file names, localized error messages and Write-Output text reached the model as U+FFFD (measured with pwsh 7.6 and Windows PowerShell 5.1)."
  change: 'args() prepends try{[Console]::OutputEncoding=[Text.UTF8Encoding]::new($false);$OutputEncoding=[Text.UTF8Encoding]::new($false)}catch{}; to the -Command text of pwsh/powershell on win32 only. Command templates (config/plugin/command.ts) use the same args(), so they are fixed too. Side effects: console tools that follow the console code page (ping, cmd dir) print English/UTF-8 text, and the Windows PowerShell 5.1 error position line shows the preamble.'
