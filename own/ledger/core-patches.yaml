  change: "PermissionDomain.paths (FileAccess.resolve + authorizeExternal), ShellDomain.authorize (the shell tool's prepare: ShellParse.scan, external directories, `shell` assert; added 2026-10-17, decisions RO-D5 and RO-R1: it scans through the new ShellParse.approval, which scans PowerShell with a lone CR as the line break PowerShell makes of it, and asks through ShellParse.asked, which asks a command the scanner finds no command in, such as a PowerShell expression, a bash assignment or a bare redirection, as a whole unless it only changes directories, and a command with a lone CR also as a whole and line by line, so a `shell` deny refuses it and a rule saved for its first command does not cover the rest). Failures become a ToolFailure whose cause is the permission error, so the session reports permission.rejected like core tools; a plain decline still ends the step. FileAccess comes from this Location instance through LocationServiceMap (as listAgents reads other Locations), so the host keeps its requirements (Config too until the v2.2.5 sync, for the removed portable-scanner switch). Additive: no existing path changes. Until v2.0.32 P-019 also added PermissionDomain.assert(input, context); upstream 6a7cedcbf1 (#54930, in v2.0.32) ships its own one-argument assert(AssertInput) with the same name, so the v2.0.32 merge took upstream's and own-harness passes sessionID, agent and the tool-call source itself (packages/own-harness/src/permission.ts). The agent is required there: upstream makes it optional, and without it the read-only mode's and the explore role's agent rules would not apply."
