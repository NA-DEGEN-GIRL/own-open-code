#             §4) and, on 2026-10-31, 3.8.1. Both 3.8.1 archives were downloaded on 2026-10-31 and match the sha256
#             and byte sizes above; native.ts lfs checked and unpacked them (git-lfs binaries: linux-x64-baseline
