# Recorded as a comment: the list entries are upstream files that check-surface hashes. git-lfs ships unmodified for
# hosts without it: packages/own-remote/script/native.ts GIT_LFS pins it, build-remote.ps1 (step 2b) checks each archive
# against the pin before unpacking, and bundle.ts puts the binary with its license in
# remote/tools/git-lfs/<version>/<target>/, next to <target>.tar.gz and not inside it (FORK §8.2 step 6, §10).
# script/native.test.ts keeps this record equal to GIT_LFS.
#   name:     git-lfs (Git LFS), the official static Linux build (CGO_ENABLED=0), unmodified
#   source:   https://github.com/git-lfs/git-lfs/releases/tag/v3.8.1 (published 2026-10-22)
#   version:  3.8.1 (was 3.8.0 of 2026-08-28; 3.8.1 fixes CVE-2026-69260 unquoted SSH remote command,
#             CVE-2026-69261 Cookie headers sent to another host after a redirect, CVE-2026-105802 a submodule URL
#             with a line feed runs a program, CVE-2026-105803 a custom transfer adapter in .lfsconfig runs a program)
#   archives: git-lfs-linux-amd64-v3.8.1.tar.gz (linux-x64-baseline, 5,917,265 bytes)
#               sha256 e72cf723a4a660438862282e8aecf3885fc8123e88bfcad534cf6b941a354b75
