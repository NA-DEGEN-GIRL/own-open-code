[package]
name = "own-vault"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
description = "own-open-code DPAPI vault helper: JSON-lines over stdio, one file per account"
publish = false

[lib]
name = "own_vault"
path = "src/lib.rs"

[[bin]]
name = "own-vault"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Security_Cryptography",
  "Win32_Storage_FileSystem",
  "Win32_System_Threading",
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
